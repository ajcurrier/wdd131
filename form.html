<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ashley Currier">
    <meta name="description" content="International Confederation of Planets Product form for starship engine components. To be signed by chief Engineer and submitted to starfleet command">
    <!-- css -->
    <link rel="stylesheet" href="styles/form.css">
    <link rel="stylesheet" href="styles/form-desktop.css"> 
    <title>Product Review</title>
    <script src="scripts/form.js" defer></script>
  <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&display=swap"
    rel="stylesheet">
</head>
<body>
    <header>
        
    </header>
    <main>
        
        <h1>Product Review</h1>
        <p>Starship Engine Part</p>
        <form method="get" action="review.html">
            <!-- Products Drop Down -->

                <fieldset>
                    
                    <label for="product">
                        Product Name
                    </label>
                    <select id="product" name="review" class="js-products" required>
                        <option value="" disabled selected="selected">Select a Product</option>
                    </select>
                    
                </fieldset>
            <!-- Star Reviews -->
            <fieldset id="overall-rating">
                <legend>Overall Rating </legend>
                    
                    <div class="radio-group">
                        <input type="radio" name="stars" id="five-stars" value="5" required>
                        <label for="five-stars">⭐ </label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" name="stars" id="four-stars" value="4" required>
                        <label for="four-stars">⭐⭐</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" name="stars" id="three-stars" value="3" required>
                        <label for="three-stars">⭐⭐⭐</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" name="stars" id="two-stars" value="2" required>
                        <label for="two-stars">⭐⭐⭐⭐</label>
                    </div>
                    <div class="radio-group">
                        <input type="radio" name="stars" id="one-star" value="1" required>
                        <label for="one-star">⭐⭐⭐⭐⭐</label>
                    </div>
                
            </fieldset>
                
            <!-- Date of Installation -->
            <fieldset id="installation-date">
                <label for="date">Date of Installation</label>
                <input type="date" id="date" name="installation-date" required>
            </fieldset>
        <!-- Useful Features Checkbox -->
            <fieldset id="features">
                <legend>Which features did you find useful?</legend>
                <p>(Check all that Apply)</p>
                
                <label for="features-durability"><input type="checkbox" id="features-durability" name="features" value="durability"> Durability</label>
                <label for="ease"><input type="checkbox" id="ease" name="features" value="ease">Ease of Use</label>
                <label for="performance"><input type="checkbox" id="performance" name="features" value="performance"> Performance</label>
                <label for="design"><input type="checkbox" id="design" name="features" value="design"> Design</label>
            </fieldset>
        <!-- Written Review Textbox-->
            <fieldset id="written-review">
                
                <label for="review-input">Written Review (optional)</label>
                <textarea name="review-input" id="review-input" rows="10"></textarea>
            </fieldset>

        <!-- Name Input -->
            <fieldset id="name">
                <label for="name-input">Your Name (optional)</label>
                <input type="text" name="name" id="name-input" placeholder="Montgomery Scott">
            </fieldset>
        <!-- Submit Button -->
            <input id="submit" type="submit" value="Send Review">
    
        </form>
    </main>
    <footer>
        <p>&copy;<span id="currentyear"></span> <a href="https://ajcurrier.github.io/wdd131/index.html"
                target="_blank">Ashley Currier</a> United States</p>
        <span>Last Modified: </span>
        <span id="lastModified"></span>
        <p>👻Happy Halloween👻</p>
    </footer>
</body>
</html>
